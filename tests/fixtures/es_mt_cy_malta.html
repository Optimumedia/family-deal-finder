 All Inclusive - sprawdź!","meta":[],"openGraph":[{"id":87,"property":"title","content":"Majówka {{year.current}}"},{"id":88,"property":"image:alt","content":"majówka"}],"link":[]},"banner":null,"listing":null,"faq":[],"shortcuts":[],"parameterOverrides":null,"productBanner":null},{"id":208,"pathname":"/offers?(rateType=roundTrip)","appType":"offers","createdAt":"2024-12-19T15:40:29.766Z","updatedAt":"2024-12-19T15:41:00.586Z","publishedAt":"2024-12-19T15:40:31.401Z","locale":"pl","documentId":"wgspxeg4f2f6521aapxcczsl","productBannerOrder":null,"head":{"id":209,"title":null,"description":null,"meta":[],"openGraph":[],"link":[]},"banner":null,"listing":null,"faq":[{"id":13,"title":"Zagraniczne wycieczki objazdowe - na czym polegają?","description":"Zapraszamy do świata niezapomnianych podróży z naszymi \u003cb\u003ezagranicznymi wycieczkami objazdowymi\u003c/b\u003e. Na czym polegają? To wyjątkowa forma podróży, podczas której zwiedzasz różne miejsca, odkrywasz ich kulturę, historię i uroki, ciesząc się jednocześnie komfortem i profesjonalną organizacją. Charakteryzują się one planem podróży obejmującym kilka lokalizacji, dzięki czemu masz okazję poznać różne atrakcje.\u003cbr\u003e\u003cbr\u003e\n  Podczas takich wycieczek zapewniamy transport między miejscami, zakwaterowanie oraz przewodnika. Możesz odkrywać zabytki, smakować lokalnej kuchni, uczestniczyć w atrakcjach kulturalnych i cieszyć się pięknem krajobrazów. Na nasze \u003cb\u003ezagraniczne wycieczki objazdowe\u003c/b\u003e wyruszysz wygodnymi i nowoczesnymi autokarami z wifi i klimatyzacją, co pozwoli na elastyczność w planowaniu trasy. To idealna opcja dla osób, które chcą w krótkim czasie zobaczyć jak najwięcej atrakcji danego obszaru.\u003cbr\u003e\u003cbr\u003e\n  Nasza oferta obejmuje szeroki wybór \u003cb\u003ewycieczek objazdowych po Europie\u003c/b\u003e. Selva Tour to doświadczone biuro podróży specjalizujące się w organizacji wyjątkowych podróży.\u003cbr\u003e\u003cbr\u003e\n  \u003cb\u003eWycieczki zagraniczne objazdowe\u003c/b\u003e organizowane są w grupach, co pozwala podróżować w towarzystwie innych pasjonatów odkrywania świata. Trasa obejmuje różne atrakcje turystyczne, historyczne zabytki, wspaniałe krajobrazy i miejsca o unikalnym charakterze.\u003cbr\u003e\u003cbr\u003e\n  \u003cb\u003eLast Minute Wycieczki Objazdowe\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n  Czas na spontaniczną przygodę!\u003cbr\u003e\u003cbr\u003e\n  Jeżeli jesteś miłośnikiem spontanicznych podróży, wybierz \u003cb\u003elast minute wycieczki objazdowe\u003c/b\u003e. Dzięki nim możesz w ostatniej chwili podjąć decyzję o wyjeździe i cieszyć się przygodą pełną wrażeń.\u003cbr\u003e\u003cbr\u003e\n  Nasi eksperci dbają o to, aby \u003cb\u003eautokarowe wycieczki zagraniczne\u003c/b\u003e były nie tylko pełne atrakcji, ale także wygodne. Komfortowe zakwaterowanie, sprawny transport i profesjonalni przewodnicy to elementy, które wyróżniają nasze wycieczki. Odkrywaj świat w pełni komfortu z Selva Tour!\n  "},{"id":14,"title":"Wycieczki objazdowe po Europie - dlaczego warto?","description":"\u003cb\u003eWycieczki objazdowe po Europie\u003c/b\u003e to niezwykła okazja do odkrywania bogactwa kulturowego, historycznego i przyrodniczego tego fascynującego kontynentu. Selva Tour zaprasza Cię na wyjątkową podróż, gdzie każdy dzień to nowa przygoda, a każde miejsce ma swoją niepowtarzalną historię i tradycje.\u003cbr\u003e\u003cbr\u003e\n  Dlaczego warto udać się na \u003cb\u003eautokarowe wycieczki zagraniczne\u003c/b\u003e z Selva Tour?\u003cbr\u003e\u003cbr\u003e\n  Nasze \u003cb\u003ebiuro podróży\u003c/b\u003e oferuje \u003cb\u003ewycieczki objazdowe\u003c/b\u003e, które poszerzają horyzonty!\u003cbr\u003e\u003cbr\u003e\n  Odkrywanie Europy w ramach wycieczek objazdowych to niepowtarzalna szansa na poszerzenie horyzontów. Z Selva Tour możesz zwiedzić zabytkowe miasta, podziwiać malownicze krajobrazy, słynne atrakcje turystyczne i uczestniczyć w lokalnych tradycjach. Każda trasa została starannie zaplanowana, aby dostarczyć Ci niezapomnianych wrażeń.\u003cbr\u003e\u003cbr\u003e\n  Warto wybrać się na tego rodzaju wyprawę ze względu na komfort podróży – nasi organizatorzy dbają o transport, zakwaterowanie i plan zwiedzania, co pozwoli Ci skupić się na pełnym relaksie i odkrywaniu nowych miejsc.\u003cbr\u003e\u003cbr\u003e\n  \u003cb\u003eAutokarowe wycieczki zagraniczne\u003c/b\u003e umożliwią Ci poznawanie różnych kultur i tradycji podczas jednego wyjazdu. Nasi profesjonalni przewodnicy podzielą się wiedzą na temat historii, sztuki i życia codziennego miejsc, które odwiedzisz.\u003cbr\u003e\u003cbr\u003e\n  Nawiązywanie nowych znajomości i dzielenie się wrażeniami z innymi podróżnymi to kolejny atut tego rodzaju wyjazdu. Wycieczki grupowe stwarzają atmosferę wspólnoty, co sprawia, że podróżowanie staje się jeszcze bardziej atrakcyjne.\u003cbr\u003e\u003cbr\u003e\n  Jeśli masz ograniczony czas na podróżowanie, \u003cb\u003ewycieczki objazdowe\u003c/b\u003e to efektywny sposób na zobaczenie wielu miejsc w jednej podróży. To czyni je wyjątkowo atrakcyjnymi dla wielu osób marzących o kompleksowym poznaniu uroków Europy.\n  "},{"id":15,"title":"Wycieczki objazdowe autokarem - jakie oferujemy?","description":"\u003cb\u003eWycieczki objazdowe autokarem\u003c/b\u003e to wyjątkowy sposób na poznawanie różnych zakątków Europy. Selva Tour, jako doświadczone biuro podróży, oferuje unikalne trasy i niezapomniane przeżycia dla pasjonatów podróży.\u003cbr\u003e\u003cbr\u003e\n  Różnorodność Destynacji\u003cbr\u003e\u003cbr\u003e\n  Zapraszamy do odkrywania fascynujących miejsc! Niezależnie czy marzysz o romantycznym Paryżu, zabytkowej Italii, czy urokach Hiszpanii, mamy dla Ciebie idealną trasę. Nasze wycieczki obejmują m.in. Turcję, Litwę, Węgry oraz Słowenię, pozwalając na pełne zanurzenie się w kulturze, historii i przyrodzie odwiedzanych miejsc.\u003cbr\u003e\u003cbr\u003e\n  Luksusowe Autokary i Wygodne Zakwaterowanie\u003cbr\u003e\u003cbr\u003e\n  Z myślą o Twoim komforcie, oferujemy wycieczki autokarem wyposażonym w najnowsze udogodnienia. Przestronne siedzenia, klimatyzacja, toaleta oraz system rozrywki zapewnią Ci przyjemność podróżowania.\u003cbr\u003e\u003cbr\u003e\n  Profesjonalni Przewodnicy i Program Zwiedzania\u003cbr\u003e\u003cbr\u003e\n  Nasi doświadczeni przewodnicy to gwarancja pełnego zrozumienia historii, kultury i tradycji miejsc, które odwiedzamy. Programy zwiedzania są starannie opracowane, by dostarczyć Ci jak najwięcej atrakcji i unikalnych doświadczeń. Bez względu na to, czy fascynuje Cię sztuka, architektura czy kulinaria, nasze \u003cb\u003ewycieczki objazdowe autokarem\u003c/b\u003e spełnią Twoje oczekiwania.\u003cbr\u003e\u003cbr\u003e\n  Wspólnota i Nowe Znajomości\u003cbr\u003e\u003cbr\u003e\n  Podróże autokarem to nie tylko możliwość zwiedzania, ale także okazja do nawiązywania nowych znajomości. Wspólne przeżycia, wieczorne rozmowy czy śpiewanie w autokarze i wspólne posiłki tworzą atmosferę, którą trudno znaleźć w innych formach podróżowania.\u003cbr\u003e\u003cbr\u003e\n  Nasze biuro podróży oferuje wycieczki objazdowe autokarem na weekendowy wypad (3 dni) do Budapesztu, Berlina, Pragi oraz na Słowację.\u003cbr\u003e\u003cbr\u003e\n  Dłuższe wycieczki trwają 5 lub 6 dni, podczas których zwiedzisz m.in. Włochy, Paryż, wyruszysz w trasę Szwajcaria-Czerwony Pociąg-Mediolan oraz trasę Amsterdam - Antwerpia - Bruksela - Gandawa.\u003cbr\u003e\u003cbr\u003e\n  Jeśli zależy Ci na tygodniowym wypoczynku, możesz wybrać spośród wycieczek do Turcji Pamukkale i Hierapolis (8 dni), Chorwacji Korčula lub Grecji.\u003cbr\u003e\u003cbr\u003e\n  Dzięki naszej ciekawej ofercie zwiedzisz najpopularniejsze oraz te mniej znane miejsca w Europie, bez względu na to, czy Twój wybór padnie na weekendową wycieczkę, czy dłuższy pobyt wypoczynkowy.\n  "}],"shortcuts":[],"parameterOverrides":null,"productBanner":null},{"id":212,"pathname":"/nasze-kierunki/:country/atrakcje/plaze/","appType":"offers","createdAt":"2 ki | {{supplier}}","description":"Egzotyczne wakacje Last Minute z Biurem Podróży {{supplier}}. Wczasy i wycieczki - największy wybór ofert w super promocji Last Minute!","meta":[],"openGraph":[{"id":805,"property":"title","content":"Egzotyczne wakacje Last Minute"},{"id":806,"property":"image:alt","content":"egzotyka Last Minute"}],"link":[]},"banner":null,"listing":null,"faq":[],"shortcuts":[],"parameterOverrides":null,"productBanner":{"id":488,"documentId":"stg4px1878ji4yerjoftrvv2"}},{"id":1144,"pathname":"/last-minute/","appType":"offers","createdAt":"2024-12-17T12:49:50.701Z","updatedAt":"2026-11-25T22:38:02.559Z","publishedAt":"2026-11-25T22:38:02.643Z","locale":"pl","documentId":"wdtb9lmgpanchiuvem1dnlq4","productBannerOrder":1,"head":{"id":953,"title":"Last Minute Wakacje - Tanie Wczasy i Wycieczki za granicę | {{supplier}}","description":"Tanie wakacje last minute z Biurem Podróży {{supplier}}. Wczasy i wycieczki - największy wybór ofert last minute!","meta":[],"openGraph":[{"id":807,"property":"title","content":"Last Minute wakacje i wycieczki"},{"id":808,"property":"image:alt","content":"wakacje last minute"}],"link":[]},"banner":null,"listing":{"id":134,"title":"Last Minute wakacje i wycieczki"},"faq":[{"id":90,"title":"Tanie wakacje z biurem podróży","description":"Doskonale wiemy, że jest czas na obowiązki i odpoczynek. Jesteśmy przekonani, że po ciężkiej pracy\n    należą Ci się idealne wakacje, przynajmniej raz w roku! Nawet jeśli skrupulatnie nie planujesz\n    swojego urlopu, możesz skorzystać \u003cstrong\u003ez tanich wakacji z biurem podróży\u003c/strong\u003e w ramach oferty\n    \u003ca href='/last-minute/lato/'\u003eLast Minute na Lato\u003c/a\u003e.\u003cbr\u003e\n    Nasza oferta pozwoli Ci jednocześnie zaoszczędzić czas i pieniądze, nacieszyć\n    oko przepięknymi widokami, spędzić aktywnie czas (rozgrywając zawody na hotelowych boiskach)\n    lub leniwie – sącząc kolorowe drinki i kosztując lokalnych przysmaków czy też patrzeć,\n    jak dzieci radośnie bawią się z animatorami ITAKA Family – wszystko tak, jak\n    lubisz. Pamiętaj, czas spędzony na leżaku pod palmą albo z rodziną i przyjaciółmi,\n    wspólnie poznając nowe miejsca na świecie, nigdy nie jest czasem straconym.\n    Łowco przygód i okazji, nie zwlekaj – sprawdź oferty Last Minute z Twojego miasta!"},{"id":91,"title":"Kiedy znaleźć najlepsze oferty Last Minute?","description":"Jak upolować atrakcyjne oferty typu Last Minute? Zazwyczaj pojawiają się one kilka lub kilkanaście dni przed wylotem,\n    a coraz częściej – nawet z wylotem danego lub następnego dnia! Na sporą okazję cenową możesz liczyć w przypadku,\n    gdy ktoś zrezygnował z wyjazdu – wówczas oferta ponownie jest widoczna na naszej stronie internetowej,\n    a Ty masz możliwość rezerwacji online. Jest to niepowtarzalna szansa na to,\n    aby wybrać się w szczęśliwą podróż! Oferty z ostatniej chwili pojawiają się przez cały rok,\n     dlatego warto trzymać rękę na pulsie i być na bieżąco. Od maja do połowy czerwca -\n    najbardziej popularne są kierunki europejskie. Zimą, zwłaszcza od początku roku do marca,\n     warto zdecydować się na egzotyczne wakacje w naprawdę dobrej cenie!"},{"id":92,"title":"Najpopularniejsze kierunki na wakacje Last Minute","description":"Najpopularniejsze kierunki Last Minute na urlop (również w formie \u003ca href='/last-minute/all-inclusive/'\u003eAll Inclusive\u003c/a\u003e,\n    wśród naszych Klientów to m.in.: \u003ca href='/last-minute/grecja/'\u003eGrecja\u003c/a\u003e, \u003ca href='/last-minute/egipt/'\u003eEgipt\u003c/a\u003e i \u003ca href='/last-minute/turcja/'\u003eTurcja\u003c/a\u003e. Ogromnym zainteresowaniem\n    cieszą się także \u003ca href='/last-minute/wyspy-kanaryjskie/'\u003eWyspy Kanaryjskie\u003c/a\u003e i \u003ca href='/last-minute/wlochy/'\u003eWłochy\u003c/a\u003e. Również zimą, spora ilość osób korzysta\n    z ofert z ostatniej chwili i lata do takich krajów jak \u003ca href='/last-minute/zanzibar/'\u003eZanzibar\u003c/a\u003e czy \u003ca href='/last-minute/tajlandia/'\u003eTajlandia\u003c/a\u003e.\n    Nie da się ukryć, że wiele osób marzy o egzotycznych wakacjach w przystępnej cenie\n    i szuka najbardziej atrakcyjnych ofert, które będą spełniały indywidualne potrzeby\n    i oczekiwania w ramach określonego budżetu. \u003cbr\u003eTwoje obowiązki służbowe nie pozwalają\n    Ci zaplanować wakacji z wyprzedzeniem i zawsze czekasz\n    do ostatniej chwili z wypisaniem wniosku urlopowego? Świetnie się składa!\n    Oferta Last Minute jest właśnie dla Ciebie, to dzięki niej będziesz cieszyć się\n    niezapomnianym urlopem. \u003cstrong\u003e Postaw na tanie wakacje Last Minute\u003c/strong\u003e z wszelkimi udogodnieniami!"}],"shortcuts":[{"id":253,"type":"destinations","description":"Sprawdź popularne kierunki na \u003cstrong\u003ewakacje Last Minute\u003c/strong\u003e:"}],"parameterOverrides":null,"productBanner":{"id":488,"documentId":"stg4px1878ji4yerjoftrvv2"}},{"id":1145,"pathname":"/all-inclusive/","appType":"offers","createdAt":"2024-12-17T12:49:50.203Z","updatedAt":"2026-11-25T22:39:05.404Z","publishedAt":"2026-11-25T22:39:05.501Z","locale":"pl","documentId":"sd3td3wim5ei8094snczigae","productBannerOrder":1,"head":{"id":954,"title":"All Inclusive Wakacje - Wczasy i Wycieczki za granice  | {{supplier}}","description":"Wakacje All Inclusive z Biurem Podróży {{supplier}}. Wczasy i wycieczki - największy wybór ofert w formule All Inclusive!","meta":[],"openGraph":[{"id":809,"property":"title","content":"All Inclusive Wakacje"},{"id":810,"property":"image:alt","content":"All Inclusive"}],"link":[]},"banner":null,"listing":{"id":135,"title":"Wakacje All Inclusive"},"faq":[{"id":93,"title":"Co oznacza All Inclusive?","description":"Chcesz wykupić wczasy i nie martwić się o dodatkowe opłaty? Jedyne, na co Cię stać to produkcja endorfin,\n     gromadzenie pięknych wspomnień i radość z nieziemskich widoków? W takim przypadku z\n    pomocą przychodzą oferty \u003cstrong\u003eAll Inclusive\u003c/strong\u003e.\u003cbr\u003e All Inclusive w dosłownym znaczeniu oznacza\n    \u003cstrong\u003ewszystko w cenie\u003c/strong\u003e, a w praktyce przekłada się to również na komfort realizowanego wypoczynku:\n    oprócz noclegów i pełnego wyżywienia z napojami i przekąskami w ciągu dnia, często masz również\n    dostęp do różnych usług świadczonych przez hotel. Pamiętaj jednak, że dokładny zakres All\n    Inclusive jest określany indywidualnie przez każdy z hoteli i warto dokładnie się z nim zapoznać,\n    aby w jak najlepszy sposób dopasować ofertę do swoich oczekiwań. W tym przypadku, swoją pomocą i\n    doświadczeniem, służą Ci nasi sprzedawcy w salonach, pracownicy Infolinii oraz osoby po drugiej stronie\n    naszego profilu na Facebooku. Gdy już będziesz w hotelu na wymarzonych wakacjach,\n    otrzymasz specjalną opaskę na rękę, która jest potwierdzeniem, że możesz \u003cstrong\u003ekorzystać z\n    formuły ALL INCLUSIVE\u003c/strong\u003e. Tak więc: nie zwlekaj, tylko rozejrzyj się wśród naszych propozycji i leć na zasłużony urlop!"},{"id":94,"title":"Różnice w typach All Inclusive","description":"W przypadku ofert All Inclusive często możesz spotkać się z różnymi określeniami – soft, ultra, premium,\n    24h itp. Oferta ta bywa rozmaita, ale nadal jest najwygodniejszą formą spędzania urlopu. Napoje –\n    często bez ograniczeń, dostęp do przekąsek, lody dla ochłody (bez dodatkowej opłaty) –\n    ALL INCLUSIVE to najprostsza droga do błogiego relaksu, bez konieczności noszenia gotówki przy sobie,\n    a to wszystko w ramach opłaconych już wakacji \u003ca href='/all-inclusive/lato/'\u003eAll Inclusive na Lato\u003c/a\u003e! \u003cstrong\u003eWyróżniamy m.in.:\n    All Inclusive 24h\u003c/strong\u003e - tutaj goście hotelowi mogą korzystać z wyżywienia, napojów bezalkoholowych i\n    lokalnych alkoholowych przez całą dobę. \u003cstrong\u003eUltra All Inclusive\u003c/strong\u003e - w cenie zawiera dodatkowo importowane\n    napoje alkoholowe. Przy opcji „24h” rozszerzony jest on o czynne przez całą dobę bary.\n    \u003cstrong\u003e All Inclusive\u003c/strong\u003e - to wersja All Inclusive zapewniająca napoje wyłącznie do posiłków\n    (często bezalkoholowe i piwo / wino oraz wodę). Są również takie hotele, gdzie przy wykupionej\n    opcji All Inclusive można dodatkowo zjeść kolację w restauracji á la carte, skorzystać z wybranych\n    usług hotelowego SPA lub spróbować swoich sił w sportach wodnych. Pamiętaj! Każdy hotel indywidualnie\n    określa zakres All Inclusive.\n    Więcej o rodzajach wyżywienia na wakacjach przeczytasz we wpisie: \u003ca href='/blog/all-inclusive-half-board-full-board-i-inne-rodzaje-wyzywienia-na-wakacjach/'\u003eAll inclusive, half board, full board i inne rodzaje wyżywienia na wakacjach\u003c/a\u003e"},{"id":95,"title":"Gdzie są najlepsze wakacje All Inclusive?","description":"\u003ca href='/all-inclusive/egipt/'\u003eEgipt\u003c/a\u003e, \u003ca href='/all-inclusive/turcja/'\u003eTurcja\u003c/a\u003e,\n    \u003ca href='/all-inclusive/wyspy-kanaryjskie/'\u003eWyspy Kanaryjskie\u003c/a\u003e i \u003ca href='/all-inclusive/grecja/'\u003eGrecja\u003c/a\u003e\n    to \u003cstrong\u003enajbardziej popularne kierunki, gdzie w hotelach realizowane\n    są pobyty typu All Inclusive\u003c/strong\u003e. Pięciogwiazdkowy hotel na Riwierze Tureckiej, położony tuż nad ciepłym\n    Morzem Śródziemnym, z bogatym zapleczem sportowo – rekreacyjnym dla całej rodziny; sprawdzony i lubiany\n    przez wielu turystów, hotel w Tunezji z bardzo dobrymi opiniami albo egipski resort z prywatną plażą i\n    rozległą rafą koralową? Tylko od Ciebie zależy, gdzie spędzisz urlop swoich marzeń! Fascynujące miejsca,\n    ważne zabytki i nieziemskie widoki w połączeniu z kulinarną przygodą, bogatą w lokalne przysmaki z pewnością\n    uprzyjemnią Twój pobyt. Czego więcej potrzeba do szczęścia? Na którykolwiek wyjazd się zdecydujesz i\n    wybierzesz hotel w All Inclusive, masz gwarancję świętego spokoju i niezapomnianego wypoczynku.\n    To ostatni dzwonek na Twoje wakacje \u003ca href='/last-minute/all-inclusive/'\u003eLast Minute z All Inclusive!\u003c/a\u003e."}],"shortcuts":[{"id":254,"type":"destinations","description":"Sprawdź najpopularniejsze kierunki na \u003cstrong\u003eurlop All Inclusive\u003c/strong\u003e:"}],"parameterOverrides":null,"productBanner":{"id":488,"documentId":"stg4px1878ji4yerjoftrvv2"}},{"id":1146,"pathname":"/last-minute/all-inclusive/","appType":"offers","createdAt":"2024-12-17T12:49:50.754Z","updatedAt":"2026-11-25T22:39:50.637Z","publishedAt":"2026-11-25T22:39:50.717Z","locale":"pl","documentId":"sd3aai7kl4gzpvip6sx4llgm","productBannerOrder":1,"head":{"id":955,"title":"Last Minute All Inclusive - Wakacje dwa w jednym | {{supplier}}","description":"Tanie wakacje Last Minute All Inclusive z Biurem Podróży {{supplier}} - wczasy i wycieczki. Super promocja Last Minute z All Inclusive!","meta":[],"openGraph":[{"id":811,"property":"title","content":"Last Minute All Inclusive"}],"link":[]},"banner":null,"listing":null,"faq":[],"shortcuts":[{"id":255,"type":"warmDestinations","description":"Last Minute All Inclusive - wakacje dwa w jednym. Sprawdź najpopularniejsze kierunki \u003cstrong\u003eAll inclusive w ofercie Last Minute\u003c/strong\u003e:"}],"parameterOverrides":null,"productBanner":{"id":488,"documentId":"stg4px1878ji4yerjoftrvv2"}},{"id":1147,"pathname":"/all-inclusive/:destinations/","appType":"offers","createdAt":"2024-12-17T12:49:50.404Z","updatedAt":"2026-11-25T22:40:16.171Z","publishedAt":"2026-11-25T22:40:16.253Z","locale":"pl","documentId":"de3mrrylo7wk9748csoj324z","productBannerOrder":1,"head":{"id":956,"title":"All Inclusive {{destination.name}} - {{year.current}} / {{year.next}} | {{supplier}}","description":"All Inclusive {{destination.name}} z Biurem Podróży {{supplier}}. Znajdź wakacje w formule All Inclusive {{destination.in}}!","meta":[],"openGraph":[{"id":812,"property":"title","content":"All Inclusive {{destination.name}}"},{"id "homepage.seePlaces.filter.country.placeholder":"Dowolnie","homepage.seePlaces.filter.search.label":"wpisz kraj","homepage.seePlaces.filter.logo.label":"We współpracy z","homepage.seePlaces.filter.noResults":"Niestety nie znaleźliśmy wyników wyszukiwania dla podanej frazy.","homepage.seePlaces.filter.date.title":"Kiedy","homepage.seePlaces.filter.date.from":"Wyjazd od","homepage.seePlaces.filter.date.to":"do","homepage.filter.applyButton.save":"Zapisz","allInclusive.header1":"Co oznacza All Inclusive?","allInclusive.content1":"Chcesz wykupić wczasy i nie martwić się o dodatkowe opłaty? Jedyne, na co Cię stać to produkcja endorfin,\n     gromadzenie pięknych wspomnień i radość z nieziemskich widoków? W takim przypadku z\n    pomocą przychodzą oferty \u003cstrong\u003eAll Inclusive\u003c/strong\u003e.\u003cbr\u003e All Inclusive w dosłownym znaczeniu oznacza\n    \u003cstrong\u003ewszystko w cenie\u003c/strong\u003e, a w praktyce przekłada się to również na komfort realizowanego wypoczynku:\n    oprócz noclegów i pełnego wyżywienia z napojami i przekąskami w ciągu dnia, często masz również\n    dostęp do różnych usług świadczonych przez hotel. Pamiętaj jednak, że dokładny zakres All\n    Inclusive jest określany indywidualnie przez każdy z hoteli i warto dokładnie się z nim zapoznać,\n    aby w jak najlepszy sposób dopasować ofertę do swoich oczekiwań. W tym przypadku, swoją pomocą i\n    doświadczeniem, służą Ci nasi sprzedawcy w salonach, pracownicy Infolinii oraz osoby po drugiej stronie\n    naszego profilu na Facebooku. Gdy już będziesz w hotelu na wymarzonych wakacjach,\n    otrzymasz specjalną opaskę na rękę, która jest potwierdzeniem, że możesz \u003cstrong\u003ekorzystać z\n    formuły ALL INCLUSIVE\u003c/strong\u003e. Tak więc: nie zwlekaj, tylko rozejrzyj się wśród naszych propozycji i leć na zasłużony urlop!","allInclusive.header2":"Różnice w typach All Inclusive","allInclusive.content2":"W przypadku ofert All Inclusive często możesz spotkać się z różnymi określeniami – soft, ultra, premium,\n    24h itp. Oferta ta bywa rozmaita, ale nadal jest najwygodniejszą formą spędzania urlopu. Napoje –\n    często bez ograniczeń, dostęp do przekąsek, lody dla ochłody (bez dodatkowej opłaty) –\n    ALL INCLUSIVE to najprostsza droga do błogiego relaksu, bez konieczności noszenia gotówki przy sobie,\n    a to wszystko w ramach opłaconych już wakacji \u003ca href='/all-inclusive/lato/'\u003eAll Inclusive na Lato 2024\u003c/a\u003e! \u003cstrong\u003eWyróżniamy m.in.:\n    All Inclusive 24h\u003c/strong\u003e - tutaj goście hotelowi mogą korzystać z wyżywienia, napojów bezalkoholowych i\n    lokalnych alkoholowych przez całą dobę. \u003cstrong\u003eUltra All Inclusive\u003c/strong\u003e - w cenie zawiera dodatkowo importowane\n    napoje alkoholowe. Przy opcji „24h” rozszerzony jest on o czynne przez całą dobę bary.\n    \u003cstrong\u003e All Inclusive\u003c/strong\u003e - to wersja All Inclusive zapewniająca napoje wyłącznie do posiłków\n    (często bezalkoholowe i piwo / wino oraz wodę). Są również takie hotele, gdzie przy wykupionej\n    opcji All Inclusive można dodatkowo zjeść kolację w restauracji á la carte, skorzystać z wybranych\n    usług hotelowego SPA lub spróbować swoich sił w sportach wodnych. Pamiętaj! Każdy hotel indywidualnie\n    określa zakres All Inclusive.","allInclusive.header3":"Gdzie są najlepsze wakacje All Inclusive?","allInclusive.content3":"\u003ca href='/all-inclusive/egipt/'\u003eEgipt\u003c/a\u003e, \u003ca href='/all-inclusive/turcja/'\u003eTurcja\u003c/a\u003e,\n    \u003ca href='/all-inclusive/wyspy-kanaryjskie/'\u003eWyspy Kanaryjskie\u003c/a\u003e i \u003ca href='/all-inclusive/grecja/'\u003eGrecja\u003c/a\u003e\n    to \u003cstrong\u003enajbardziej popularne kierunki, gdzie w hotelach realizowane\n    są pobyty typu All Inclusive\u003c/strong\u003e. Pięciogwiazdkowy hotel na Riwierze Tureckiej, położony tuż nad ciepłym\n    Morzem Śródziemnym, z bogatym zapleczem sportowo – rekreacyjnym dla całej rodziny; sprawdzony i lubiany\n    przez wielu turystów, hotel w Tunezji z bardzo dobrymi opiniami albo egipski resort z prywatną plażą i\n    rozległą rafą koralową? Tylko od Ciebie zależy, gdzie spędzisz urlop swoich marzeń! Fascynujące miejsca,\n    ważne zabytki i nieziemskie widoki w połączeniu z kulinarną przygodą, bogatą w lokalne przysmaki z pewnością\n    uprzyjemnią Twój pobyt. Czego więcej potrzeba do szczęścia? Na którykolwiek wyjazd się zdecydujesz i\n    wybierzesz hotel w All Inclusive, masz gwarancję świętego spokoju i niezapomnianego wypoczynku.\n    To ostatni dzwonek na Twoje wakacje \u003ca href='/last-minute/all-inclusive/'\u003eLast Minute z All Inclusive!\u003c/a\u003e.","lastMinute.header1":"Tanie wakacje z biurem podróży","lastMinute.content1":"Doskonale wiemy, że jest czas na obowiązki i odpoczynek. Jesteśmy przekonani, że po ciężkiej pracy\n    należą Ci się idealne wakacje, przynajmniej raz w roku! Nawet jeśli skrupulatnie nie planujesz\n    swojego urlopu, możesz skorzystać \u003cstrong\u003ez tanich wakacji z biurem podróży\u003c/strong\u003e w ramach oferty\n    \u003ca href='/last-minute/lato/'\u003eLast Minute na Lato 2024\u003c/a\u003e.\u003cbr\u003e\n    Nasza oferta pozwoli Ci jednocześnie zaoszczędzić czas i pieniądze, nacieszyć\n    oko przepięknymi widokami, spędzić aktywnie czas (rozgrywając zawody na hotelowych boiskach)\n    lub leniwie – sącząc kolorowe drinki i kosztując lokalnych przysmaków czy też patrzeć,\n    jak dzieci radośnie bawią się z animatorami Klubu Przyjaciół ITAKI – wszystko tak, jak\n    lubisz. Pamiętaj, czas spędzony na leżaku pod palmą albo z rodziną i przyjaciółmi,\n    wspólnie poznając nowe miejsca na świecie, nigdy nie jest czasem straconym.\n    Łowco przygód i okazji, nie zwlekaj – sprawdź oferty Last Minute z Twojego miasta!","lastMinute.header2":"Kiedy znaleźć najlepsze oferty Last Minute?","lastMinute.content2":"Jak upolować atrakcyjne oferty typu Last Minute? Zazwyczaj pojawiają się one kilka lub kilkanaście dni przed wylotem,\n    a coraz częściej – nawet z wylotem danego lub następnego dnia! Na sporą okazję cenową możesz liczyć w przypadku,\n    gdy ktoś zrezygnował z wyjazdu – wówczas oferta ponownie jest widoczna na naszej stronie internetowej,\n    a Ty masz możliwość rezerwacji online. Jest to niepowtarzalna szansa na to,\n    aby wybrać się w szczęśliwą podróż! Oferty z ostatniej chwili pojawiają się przez cały rok,\n     dlatego warto trzymać rękę na pulsie i być na bieżąco. Od maja do połowy czerwca -\n    najbardziej popularne są kierunki europejskie. Zimą, zwłaszcza od początku roku do marca,\n     warto zdecydować się na egzotyczne wakacje w naprawdę dobrej cenie!","lastMinute.header3":"Najpopularniejsze kierunki na wakacje Last Minute","lastMinute.content3":"Najpopularniejsze kierunki Last Minute na urlop (również w formie \u003ca href='/last-minute/all-inclusive/'\u003eAll Inclusive\u003c/a\u003e,\n    wśród naszych Klientów to m.in.: \u003ca href='/last-minute/grecja/'\u003eGrecja\u003c/a\u003e, \u003ca href='/last-minute/egipt/'\u003eEgipt\u003c/a\u003e i \u003ca href='/last-minute/turcja/'\u003eTurcja\u003c/a\u003e. Ogromnym zainteresowaniem\n    cieszą się także \u003ca href='/last-minute/wyspy-kanaryjskie/'\u003eWyspy Kanaryjskie\u003c/a\u003e i \u003ca href='/last-minute/wlochy/'\u003eWłochy\u003c/a\u003e. Również zimą, spora ilość osób korzysta\n    z ofert z ostatniej chwili i lata do takich krajów jak \u003ca href='/last-minute/zanzibar/'\u003eZanzibar\u003c/a\u003e czy \u003ca href='/last-minute/tajlandia/'\u003eTajlandia\u003c/a\u003e.\n    Nie da się ukryć, że wiele osób marzy o egzotycznych wakacjach w przystępnej cenie\n    i szuka najbardziej atrakcyjnych ofert, które będą spełniały indywidualne potrzeby\n    i oczekiwania w ramach określonego budżetu. \u003cbr\u003eTwoje obowiązki służbowe nie pozwalają\n    Ci zaplanować wakacji z wyprzedzeniem i zawsze czekasz\n    do ostatniej chwili z wypisaniem wniosku urlopowego? Świetnie się składa!\n    Oferta Last Minute jest właśnie dla Ciebie, to dzięki niej będziesz cieszyć się\n    niezapomnianym urlopem. \u003cstrong\u003e Postaw na tanie wakacje Last Minute\u003c/strong\u003e z wszelkimi udogodnieniami!","faq.camps.header1":"","faq.camps.content1":"","faq.camps.header2":"","faq.camps.content2":"","faq.camps.header3":"","faq.camps.content3":"","faq.trips.header1":"Zagraniczne wycieczki objazdowe - na czym polegają?","faq.trips.content1":"","faq.trips.header2":"Wycieczki objazdowe po Europie - dlaczego warto?","faq.trips.content2":"","faq.trips.header3":"Wycieczki objazdowe autokarem - jakie oferujemy?","faq.trips.content3":"","faq.holidays.header1":"","faq.holidays.content1":"","faq.holidays.header2":"","faq.holidays.content2":"","faq.holidays.header3":"","faq.holidays.content3":"","faq.holidays.header4":"","faq.holidays.content4":"","faq.homepage.header1":"","faq.homepage.content1":"","faq.homepage.header2":"","faq.homepage.content2":"","faq.homepage.header3":"","faq.homepage.content3":"","footer.newsletter.title":"Newsletter","footer.newsletter.confirmation.title":"Potwierdź zapis!","footer.newsletter.confirmation.emailSend":"Wysłaliśmy do Ciebie e-maila z prośbą o potwierdzenie adresu e-mail. Potwierdź swój adres i otrzymuj najlepsze oferty już dzisiaj!","footer.newsletter.confirmation.sendingAgain":"E-mail nie doszedł? Wyślij ponownie","footer.newsletter.confirmation.confirmationSendingAgain":"E-mail został wysłany ponownie","footer.newsletter.subscription.title":"Zapisz się do newslettera","footer.newsletter.subscription.discount":"Zapisz się do newslettera i odbierz 40% rabatu na przewodniki Pascala","footer.newsletter.subscription.discountForNewsletter":"i odbierz kod rabatowy 500 zł","footer.newsletter.subscription.discountForNewsletter.subtitle":"Informacje jak wykorzystać kod otrzymasz w kolejnej wiadomości po zapisie","footer.newsletter.subscription.discountForNewsletter.terms":"Po zapisaniu się do newslettera otrzymasz wiad
