<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Deal Finder</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2330;--muted:#677083;--line:#e3e1da;--accent:#0f7b6c;--accent-ink:#fff;
--good:#1f8a4c;--warn:#b26a00;--bad:#b3261e;--chip:#eef1ef;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2229;--ink:#e8eaee;--muted:#9aa3b2;--line:#2c333d;
--accent:#3cc3ad;--accent-ink:#0b1715;--good:#52c486;--warn:#e0a54a;--bad:#ef7a70;--chip:#252b33;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:1180px;margin:0 auto}
h1{margin:0;font-size:22px}.sub{color:var(--muted);font-size:13px;margin-top:2px}
main{max-width:1180px;margin:0 auto;padding:0 16px 40px}
.tabs{display:flex;gap:6px;margin:14px 0 10px}.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.bar label{display:flex;gap:6px;align-items:center}select,input[type=range]{accent-color:var(--accent)}
select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.news{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.news h2{font-size:14px;margin:0 0 6px}.news li{margin:2px 0;font-size:14px}.news ul{margin:0;padding-left:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card.out{opacity:.6}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-weight:700;font-size:16px}.area{color:var(--muted);font-size:13px}
.tier{font-size:13px;font-weight:700;white-space:nowrap;text-align:right}.tier small{display:block;color:var(--muted);font-weight:500}
.price{font-size:24px;font-weight:800}.price s{font-size:14px;color:var(--muted);font-weight:500;margin-left:6px}
.meta{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--chip);border-radius:999px;padding:3px 9px;font-size:12.5px}
.chip.good{color:var(--good)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
ul.check{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:13px}
ul.check li{display:flex;gap:6px}.y{color:var(--good)}.n{color:var(--bad)}.u{color:var(--warn)}.must{font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:13.5px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.warnbox{font-size:12.5px;color:var(--warn)}
details{font-size:13px;color:var(--muted)}details summary{cursor:pointer}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:640px;width:calc(100% - 32px);padding:16px}
dialog textarea{width:100%;height:300px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.4 ui-monospace,Consolas,monospace}
.empty{color:var(--muted);padding:30px;text-align:center}
svg.spark{width:100%;height:34px}
</style>
</head>
<body>
<header>
  <h1>Family Deal Finder</h1>
  <div class="sub" id="sub">Loading…</div>
</header>
<main>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-season="summer" aria-selected="true">☀️ Summer</button>
    <button class="tab" role="tab" data-season="winter" aria-selected="false">❄️ Winter</button>
    <button class="tab" role="tab" data-season="watch" aria-selected="false">☆ Watchlist</button>
  </div>
  <div class="bar">
    <label>Sort <select id="sort"><option value="score">Best for us</option><option value="price">Lowest price</option><option value="discount">Biggest discount</option><option value="drive">Shortest drive</option></select></label>
    <label>Max drive <input type="range" id="drive" min="120" max="360" step="15" value="345"> <span id="driveTxt"></span></label>
    <label><input type="checkbox" id="hb"> Breakfast + dinner only</label>
    <label><input type="checkbox" id="family"> Real family price (2+2) only</label>
    <label>Type <select id="kind"><option value="">All</option><option value="hotel">Hotels</option><option value="villa">Villas</option><option value="apartment">Apartments</option></select></label>
    <label><input type="checkbox" id="out"> Show "doesn't fit"</label>
  </div>
  <section class="news" id="news" hidden><h2>What's new</h2><ul id="newsList"></ul></section>
  <div class="grid" id="grid"></div>
</main>
<dialog id="dlg">
  <h3 id="dlgTitle" style="margin:0 0 6px">Ask the hotel</h3>
  <p class="meta" style="margin:0 0 8px">Review it, then send it yourself from your own email. Nothing is sent automatically.</p>
  <textarea id="dlgText"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="copy">Copy</button><button class="btn" id="close">Close</button></div>
</dialog>
<script>
const $ = s => document.querySelector(s);
const store = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let DATA = {items:[],alerts:[]}, season = store.get('season','summer'), watch = new Set(store.get('watch',[]));
const eur = n => '€' + Math.round(n).toLocaleString('en-US');
const hm = m => m==null ? '?' : `${Math.floor(m/60)}h${String(Math.round(m%60)).padStart(2,'0')}`;
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = s => { const d = new Date(s); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };

function spark(h){
  if(h.length < 2) return '<div class="meta">Price history: first sighting ' + esc(h[0]?.seen) + ' — more points come with every check.</div>';
  const ps = h.map(x=>x.price_eur), lo = Math.min(...ps), hi = Math.max(...ps), w = 300, ht = 30;
  const pts = ps.map((p,i)=>`${(i/(ps.length-1)*w).toFixed(1)},${(ht-(hi===lo?ht/2:(p-lo)/(hi-lo)*ht)+2).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${ht+4}" preserveAspectRatio="none" aria-label="price history"><polyline fill="none" stroke="currentColor" stroke-width="2" points="${pts}"/></svg><div class="meta">${h.length} price checks · low ${eur(lo)} · high ${eur(hi)}</div>`;
}

function dealChips(it){
  const d = it.deal, out = [];
  if (d.verdict === 'real') out.push(`<span class="chip good">✓ ${d.real_pct}% below its own lowest price (30 days)</span>`);
  else if (d.verdict === 'fake?') out.push(`<span class="chip bad">⚠ "Discount" but not cheaper than before</span>`);
  else if (d.verdict === 'flat') out.push(`<span class="chip">Same price as before</span>`);
  if (d.stated_pct != null) out.push(`<span class="chip ${d.verdict==='stated'?'warn':''}">Agency says −${Math.round(d.stated_pct)}%${d.verdict==='stated'?' (not yet checked by our history)':''}</span>`);
  if (d.peer_pct != null) out.push(`<span class="chip ${d.peer_pct>0?'good':''}">${d.peer_pct>0?'':'+'}${Math.abs(Math.round(d.peer_pct))}% ${d.peer_pct>0?'cheaper':'dearer'} per night than similar offers</span>`);
  (it.campaigns || []).slice(0, 2).forEach(c => out.push(`<a class="chip good" href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.title)}">🏨 Hotel's own site: ${c.pct ? '−' + c.pct + '% ' : ''}${esc(c.title.length > 60 ? c.title.slice(0, 57) + '…' : c.title)}${c.valid_until ? ' (until ' + fmtDate(c.valid_until) + ')' : ''}</a>`));
  if (d.days_left != null && d.days_left >= 0) out.push(`<span class="chip ${d.days_left<=3?'bad':'warn'}">⏰ ends in ${d.days_left} day${d.days_left===1?'':'s'}</span>`);
  return out.join('');
}

function card(it){
  const f = it.family, isW = watch.has(it.key);
  const checks = f.checklist.map(c => {
    const ic = c.state==='yes' ? '<span class="y">✓</span>' : c.state==='no' ? '<span class="n">✗</span>' : '<span class="u">?</span>';
    const tag = c.state==='yes' && !c.verified && c.key!=='reach' && c.key!=='board' ? ' <span class="meta">(unverified)</span>' : '';
    return `<li class="${c.must?'must':''}">${ic}<span>${esc(c.label)}${tag}</span></li>`;
  }).join('');
  const occ = it.occupancy === '2+2' ? 'for all 4 of you' : '<span class="warnbox">for 2 adults only — kids\' price unknown</span>';
  const why = [];
  if (it.excluded) why.push('✗ Doesn\'t fit: ' + f.failed.join(', '));
  if (it.capped) why.push('Rating capped until confirmed: ' + f.unknown_musts.join(', '));
  return `<article class="card ${it.excluded?'out':''}">
    <div class="top"><div><div class="name">${esc(it.name)} ${'★'.repeat(it.stars||0)}${it.kind && it.kind!=='hotel' ? ` <span class="chip">${it.kind==='villa'?'🏡 Villa':'🏠 Apartment'}</span>` : ''}</div><div class="area">${esc(it.area)}</div></div>
      <div class="tier">${it.tier.icon} ${esc(it.tier.label)}<small>score ${Math.round(it.overall)}</small></div></div>
    <div><span class="price">${eur(it.price_eur)}</span>${it.was_eur?`<s>${eur(it.was_eur)}</s>`:''} <span class="meta">${occ}</span></div>
    <div class="meta">${it.nights} nights from ${fmtDate(it.check_in)} · ${it.board==='?'?'board unknown':it.board==='SC'?'self-catering':esc(it.board)} · ${esc(it.room||'')} · 🚗 ${hm(f.drive_minutes)} from Skopje</div>
    <div class="chips">${dealChips(it)}</div>
    <ul class="check">${checks}</ul>
    ${why.length?`<div class="warnbox">${why.map(esc).join('<br>')}</div>`:''}
    ${it.notes?`<div class="meta">${esc(it.notes)}</div>`:''}
    <details><summary>Price history & score</summary>${spark(it.history)}
      <div>Family fit ${f.score} (confidence ${Math.round(f.confidence*100)}%) · Deal ${it.deal.score} · Source: ${esc(it.source)}, seen ${esc(it.last_seen)}</div></details>
    <div class="row">
      <a class="btn primary" href="${esc(it.url)}" target="_blank" rel="noopener">Open offer</a>
      ${it.email?`<button class="btn" data-ask="${esc(it.key)}">✉ Ask the hotel (${f.questions.length})</button>`:''}
      <button class="btn" data-watch="${esc(it.key)}">${isW?'★ Watching':'☆ Watch'}</button>
    </div></article>`;
}

function render(){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.season===season));
  const maxDrive = +$('#drive').value; $('#driveTxt').textContent = hm(maxDrive);
  let items = DATA.items.filter(i => season==='watch' ? watch.has(i.key) : i.season===season);
  if (!$('#out').checked && season!=='watch') items = items.filter(i => !i.excluded);
  items = items.filter(i => i.family.drive_minutes==null || i.family.drive_minutes <= maxDrive);
  if ($('#hb').checked) items = items.filter(i => ['HB','FB','AI'].includes(i.board));
  if ($('#family').checked) items = items.filter(i => i.occupancy==='2+2');
  if ($('#kind').value) items = items.filter(i => (i.kind||'hotel') === $('#kind').value);
  const s = $('#sort').value;
  const key = {score:i=>-i.overall, price:i=>i.price_eur, discount:i=>-(i.deal.real_pct ?? i.deal.stated_pct ?? -99), drive:i=>i.family.drive_minutes ?? 9999}[s];
  items.sort((a,b)=>key(a)-key(b));
  $('#grid').innerHTML = items.length ? items.map(card).join('') : `<div class="empty">${season==='watch'?'Nothing on your watchlist yet — tap ☆ Watch on a deal.':'No offers match these filters.'}</div>`;
}

function init(d){
  DATA = d;
  $('#sub').textContent = `${d.family.adults} adults + ${d.family.kids} kids from ${d.family.home} · direct flight or ≤${hm(d.family.max_drive_minutes)} drive · updated ${d.generated.replace('T',' ')}`;
  if (d.alerts.length){ $('#news').hidden = false; $('#newsList').innerHTML = d.alerts.map(a => `<li>${a.icon} ${esc(a.text)}</li>`).join(''); }
  ['sort','drive','hb','family','kind','out'].forEach(id => { const el = $('#'+id), saved = store.get('f_'+id, null);
    if (saved!=null){ if (el.type==='checkbox') el.checked = saved; else el.value = saved; }
    el.addEventListener('input', () => { store.set('f_'+id, el.type==='checkbox'?el.checked:el.value); render(); }); });
  render();
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { season = t.dataset.season; store.set('season', season); render(); }));
$('#grid').addEventListener('click', e => {
  const a = e.target.closest('[data-ask]'), w = e.target.closest('[data-watch]');
  if (a){ const it = DATA.items.find(i => i.key===a.dataset.ask); $('#dlgTitle').textContent = 'Ask ' + it.name; $('#dlgText').value = it.email; $('#dlg').showModal(); }
  if (w){ const k = w.dataset.watch; watch.has(k) ? watch.delete(k) : watch.add(k); store.set('watch',[...watch]); render(); }
});
$('#copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('#dlgText').value); $('#copy').textContent='Copied ✓'; } catch { $('#dlgText').select(); } setTimeout(()=>$('#copy').textContent='Copy',1500); });
$('#close').addEventListener('click', () => $('#dlg').close());
fetch('data.json', {cache:'no-store'}).then(r => r.json()).then(init).catch(() => { $('#sub').textContent = 'Could not load data.json — run "python -m trips.run", then open the page with open_dashboard.ps1.'; });
</script>
</body>
</html>
