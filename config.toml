# ---------------------------------------------------- sea, snow, places nearby --
[conditions]
# Sea/air temperature and snow (Open-Meteo, typical of the last 3 seasons) and family places
# within 5 km (OpenStreetMap / Overpass), per area. Cached in data/conditions_cache.json for 30 days.
enabled = true
max_requests = 60          # live requests per run, all hosts together (a full refresh is ~37)
places_radius_m = 5000
ski_radius_m = 10000       # ski towns sit below the beginner areas
hospital_radius_m = 30000
years = 3

# ------------------------------------------------------------------ guest ratings --
[ratings]
# The family's rule: never show a hotel rated below 4.3 / 5 (Google and other 5-point sites)
# or 8.2 / 10 (Booking and other 10-point sites). Ratings with fewer reviews than min_reviews are ignored.
# Google ratings come from the official Places API: put google_api_key = "..." in config.local.toml.
enabled = true
min_5 = 4.3
min_10 = 8.2
min_reviews = 10
unknown_is_must = true      # no rating known yet: shown, but capped and marked "check rating"
budget = 50                 # Google lookups per run (cached 60 days)
refresh_days = 60
max_km = 15
cache = "data/ratings_cache.json"

[email]
# Daily digest. SMTP settings live in the git-ignored file .email
# (SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_TO). Without it the
# digest is only written to data/digest.txt.
enabled = true

