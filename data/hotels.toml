# ============================================================================
#  Hotels we track, with the family facts that matter for 2 adults + twins.
#
#  Every family fact is one of: true / false / a number — or left out (= unknown).
#  `verified` lists the facts confirmed in writing (hotel email, official page).
#  Everything else is INFERRED (general knowledge, agency text) and is shown on
#  the dashboard with a "?" until verified. Must-haves that are unknown cap the
#  rating and generate a question for the hotel.
#
#  lat/lng are approximate (resort level) unless coords_approx = false.
# ============================================================================

